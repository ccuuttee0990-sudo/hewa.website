<!DOCTYPEhtml>
<html lang="ckb" dri="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شوێنکاری وەستا هیوا|چاککردنی ‌ئۆتۆمبێلی ۆتۆماتیکی</title>
<style>
    *{box-sizing: border-box;
     margin:  0;
     padding:   0;}
body {
        background-color: #0d1b2a;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
    }

    .landing-card {
        background: rgba(27, 38, 59, 0.85);
        border: 2px solid #ffb703;
        border-radius: 20px;
        padding: 40px 30px;
        max-width: 450px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
    }

    .logo {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 3px solid #ffb703;
        object-fit: cover;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
    }

    .info-text p {
        color: #cbd5e1;
        font-size: 1.05rem;
        line-height: 1.8;
        margin-bottom: 12px;
    }

    .info-text p strong {
        color: #ffb703;
    }

    .enter-btn {
        display: inline-block;
        background-color: #e63946;
        color: #ffffff;
        font-size: 1.1rem;
        font-weight: bold;
        text-decoration: none;
        padding: 14px 35px;
        border-radius: 30px;
        margin-top: 25px;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(230, 57, 70, 0.4);
    }

    .enter-btn:hover {
        background-color: #d62828;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(230, 57, 70, 0.6);
    }
</style>
<div class="landing-card">
    <!-- لۆگۆی وێبسایتەکە -->
    <img src="logo.jpg" alt="لۆگۆی وەستا هیوا" class="logo">

    <!-- ئەو بەشەی دیاریت کردبوو -->
    <div class="info-text">
        <p>📍 <strong>ناو نیشان:</strong> سلێمانی | 📞 <strong>ژمارەی پەیوەندی:</strong> 07701585986</p>
        <p>2026 شوێنکاری وەستا هیوا - متمانەی تۆ، پیشەسازیی ئیمە</p>
    </div>

    <!-- دوگمەی چوونە ناو وێبسایت -->
    <a href="main.html" class="enter-btn">چوونە ناو وێبسایت ⚙️</a>
</div>
